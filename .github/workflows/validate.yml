name: CrimeMap checks

on:
  push:
    branches: [dev/shwetha]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run backend tests
        run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend input validation
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crimemap_ci
          POSTGRES_USER: crimemap_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crimemap_ci -d crimemap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crimemap_ci:ci_only_password@127.0.0.1:5432/crimemap_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database driver and backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Create PostgreSQL schema and test account
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from app.db import Base, SessionLocal, engine
          import app.main  # Register all models.
          from app.auth import create_user
          assert engine.dialect.name == "postgresql"
          Base.metadata.create_all(bind=engine)
          with SessionLocal() as db:
              user = create_user(db, "testadmin", "postgres-ci-only-password", "admin")
              assert user.role == "admin"
          assert {"incidents", "users", "login_sessions", "prevention_plans", "audit_events"} <= set(inspect(engine).get_table_names())
          print("PostgreSQL schema and demo account: OK")
          PY
      - name: Seed exactly 100 fictional incidents
        working-directory: backend
        run: |
          python -m scripts.seed_demo
          python -m scripts.seed_demo
          python - <<'PY'
          from sqlalchemy import func, select
          from app.db import SessionLocal
          from app.models import Incident
          from app.auth_models import User
          with SessionLocal() as db:
              assert db.scalar(select(func.count()).select_from(Incident)) == 100
              assert db.scalar(select(func.count()).select_from(User)) == 1
          print("PostgreSQL seed is idempotent, 100 fixtures; account preserved")
          PY

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend in Windows virtualenv
        shell: pwsh
        run: |
          python -m venv backend/.venv
          & "backend/.venv/Scripts/python.exe" -m pip install -r backend/requirements-dev.txt
      - name: Install frontend for launcher smoke test
        working-directory: frontend
        run: npm ci
      - name: Test Windows launcher logic
        shell: pwsh
        working-directory: backend
        run: |
          & ".venv/Scripts/python.exe" -m pytest -q tests/test_launcher.py
      - name: Smoke test one-terminal Windows startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          $python = Join-Path $root 'backend/.venv/Scripts/python.exe'
          $stdout = Join-Path $root 'launcher-stdout.log'
          $stderr = Join-Path $root 'launcher-stderr.log'
          $launcher = Start-Process -FilePath $python -ArgumentList 'start.py' -WorkingDirectory $root -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              if ($launcher.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 2
                $frontend = Invoke-WebRequest -Uri 'http://127.0.0.1:5173' -TimeoutSec 2 -UseBasicParsing
                if ($health.status -eq 'ok' -and $frontend.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 1000
            }
            if (-not $ready) {
              throw 'Windows launcher did not start both FastAPI and Vite.'
            }
            Write-Host 'Windows launcher served FastAPI health and Vite successfully.'
          } finally {
            if (-not $launcher.HasExited) {
              & taskkill.exe /PID $launcher.Id /T /F | Out-Null
            }
            Write-Host 'Launcher stdout:'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host 'Launcher stderr:'
            if (Test-Path $stderr) { Get-Content $stderr }
          }

  cloudrun-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production Cloud Run image
        run: docker build --tag crimemap-cloudrun:ci .
      - name: Smoke-test compiled UI and protected API from one container
        run: |
          docker run -d --name crimemap-cloudrun-ci \
            -p 127.0.0.1:8080:8080 \
            -e CRIMEMAP_DEPLOYMENT=local \
            -e DATABASE_URL=sqlite:////tmp/crimemap-cloudrun-ci.db \
            crimemap-cloudrun:ci
          trap 'docker logs crimemap-cloudrun-ci; docker rm -f crimemap-cloudrun-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl --fail --silent http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl --fail --silent http://127.0.0.1:8080/sample-data/synthetic_incidents.csv | head -n 1 | grep -q 'category'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/incidents)" = "401"
      - name: Reject cloud deployment without Cloud SQL config
        run: |
          if docker run --rm crimemap-cloudrun:ci python -c "import app.db"; then
            echo "Cloud mode must not boot without Cloud SQL configuration" >&2
            exit 1
          fi
