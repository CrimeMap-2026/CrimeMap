name: One-time Tailwind dependency lockfile refresh

on:
  push:
    branches: [dev/shwetha]
    paths:
      - '.github/workflows/tailwind-lock-refresh.yml'
      - 'frontend/package.json'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Tailwind v4 Vite dependencies into committed npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only frontend/package-lock.json
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(frontend): lock Tailwind v4 dependencies"
          git push origin HEAD:dev/shwetha
